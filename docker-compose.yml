services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mountain_nest
      POSTGRES_USER: mountain_user
      POSTGRES_PASSWORD: 9LB9nouHSonJL8PSzrU6ulXgrec8ZEZI
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # 5437 on the host, not 5432. Host 5432 is already occupied on the
      # development machine, and a standalone `mountain-nest-db` container has
      # published 5437 since 2026-05-19 — which is the port `.env.local` has
      # always named. This file said 5432, so the two never agreed and
      # `docker compose up db` could not bind. Only one of the two may run at a
      # time, which is intended: whichever is up, the app finds it on 5437.
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mountain_user -d mountain_nest"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://mountain_user:9LB9nouHSonJL8PSzrU6ulXgrec8ZEZI@db:5432/mountain_nest
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      UPLOADTHING_SECRET: ${UPLOADTHING_SECRET:-}
      UPLOADTHING_APP_ID: ${UPLOADTHING_APP_ID:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
